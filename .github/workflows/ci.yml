name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - '!CLAUDE.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'
      - '.claude/**'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.svg'
  pull_request:
    paths-ignore:
      - '*.md'
      - '!CLAUDE.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claudeignore'
      - '.claude/**'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - '**.svg'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Static check
        run: make static-check

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [static-check]
    runs-on: ubuntu-latest
    # dlib is built from source via cmake + make. Multi-arch under QEMU
    # (arm64, arm/v7) takes ~30-45 min per platform to compile gui_widgets
    # and gui_core modules. 90 min gives a safe buffer.
    timeout-minutes: 90
    permissions:
      contents: write       # gh release create
      packages: write       # registry push (GHCR)
      id-token: write       # cosign keyless OIDC (Sigstore Fulcio)

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract DLIB_VERSION from Makefile
        id: dlib
        run: echo "version=$(grep -oP '^DLIB_VERSION\s*:=\s*\K[\d.]+' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      # =================================================================
      # GATE 1: single-arch local build for scanning + smoke testing
      # =================================================================
      - name: Build image for scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: dlib-docker:scan
          build-args: |
            DLIB_VERSION=${{ steps.dlib.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =================================================================
      # GATE 2: Trivy image scan (CRITICAL/HIGH blocking)
      # Catches CVEs in the base image, apt packages, and build artifacts
      # that the filesystem scan cannot see.
      # =================================================================
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'dlib-docker:scan'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # =================================================================
      # GATE 3: smoke test — process-up + dlib headers/shared lib present.
      # This is a utility container (CMD tail -f /dev/null); the check
      # verifies the from-source build actually installed dlib under
      # /usr/local. Matches the Makefile `make test` target.
      # =================================================================
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm dlib-docker:scan bash -c \
            'test -f /usr/local/include/dlib/matrix.h && ls /usr/local/lib/libdlib.so*'

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.vendor=Andriy Kalashnykov - andriykalashnykov@gmail.com
            org.opencontainers.image.title=Dlib Ubuntu Docker image
            org.opencontainers.image.description=Dlib Ubuntu Docker image
            org.opencontainers.image.licenses=CC0
            org.opencontainers.image.version=${{ github.ref_name }}
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/AndriyKalashnykov/dlib-docker/main/README.md
            io.artifacthub.package.maintainers=[{"name":"Andriy Kalashnykov","email":"andriykalashnykov@gmail.com"}]
            io.artifacthub.package.license=CC0

      # =================================================================
      # GATE 4: multi-arch build + push (all gates above passed)
      # cache-from: type=gha is ~95% cache-hit from the scan build above,
      # so this second build only compiles the arm platforms under QEMU.
      # =================================================================
      - name: Build and push
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            DLIB_VERSION=${{ steps.dlib.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =================================================================
      # GATE 5: cosign keyless OIDC signing.
      # No long-lived keys — uses GitHub OIDC → Sigstore Fulcio → Rekor.
      # Signs by digest so the signature covers the exact published
      # manifest regardless of tag mutation.
      # =================================================================
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image with cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "→ cosign sign ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists (likely created by 'make release'). Skipping."
          else
            gh release create "${{ github.ref_name }}" --generate-notes --verify-tag --title "${{ github.ref_name }}"
          fi

  ci-pass:
    if: always()
    needs: [static-check, docker]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled"
            echo "  static-check: ${{ needs.static-check.result }}"
            echo "  docker:       ${{ needs.docker.result }}"
            exit 1
          fi
