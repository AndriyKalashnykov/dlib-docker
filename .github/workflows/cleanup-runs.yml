name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cleanup-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RETAIN_DAYS: 7
      KEEP_MINIMUM: 5
    steps:
      - name: Delete old workflow runs
        run: |
          CUTOFF=$(date -u -d "$RETAIN_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh run list --repo "${{ github.repository }}" \
            --json databaseId,createdAt --limit 200 \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_MINIMUM:] | .[] | select(.createdAt < \"$CUTOFF\") | .databaseId" \
          | xargs -r -I{} gh run delete {} --repo "${{ github.repository }}"

  cleanup-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete stale caches
        run: |
          gh cache list --repo "${{ github.repository }}" --limit 100 \
            --json id,ref \
            --jq '.[] | select(.ref | startswith("refs/heads/")) | "\(.id) \(.ref)"' | \
          while read -r id ref; do
            branch="${ref#refs/heads/}"
            if ! gh api "repos/${{ github.repository }}/branches/$branch" >/dev/null 2>&1; then
              echo "Deleting cache $id for stale branch $branch"
              gh cache delete "$id" --repo "${{ github.repository }}" || true
            fi
          done
